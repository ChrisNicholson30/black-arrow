[package]
name = "blackarrow-base"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "blackarrow_base"
path = "src/lib.rs"
doctest = false

[lints]
workspace = true

# This crate sits underneath every other crate in the workspace, including the
# ones that resolve the state directory. Keep it free of workspace crates.
[target.'cfg(unix)'.dependencies]
libc = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
